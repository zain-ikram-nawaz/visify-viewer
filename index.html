<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visify — 3D Configurator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #f1f5f9; /* Slate tint to contrast against the white widget */
    color: #0f172a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; /* Prevents unwanted double scrollbars */
  }

  /* ── Header ── */
  header {
    padding: 0 28px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #e2e8f0;
    background: #ffffff;
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: #0f172a;
    text-transform: uppercase;
  }
  .logo span { color: #5a31f4; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
    animation: live-pulse 2s ease-in-out infinite;
  }

  @keyframes live-pulse {
    0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
    60%  { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  .header-badge {
    font-size: 11px;
    color: #64748b;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-weight: 600;
  }

  /* ── Main Workspace ── */
  main {
    flex: 1;
    display: flex;
    padding: 20px; /* Gives breathing space around the configurator widget */
    background: #f8fafc;
    overflow: hidden;
  }

  #visify-configurator {
    width: 100%;
    height: 100%;
    display: flex;
  }
</style>
  </head>
  <body>

    <header>
      <div class="logo">VI<span>SI</span>FY</div>
      <div class="header-right">
        <div class="live-dot"></div>
        <div class="header-badge">3D Preview</div>
      </div>
    </header>

    <main>
      <div id="visify-configurator"></div>
    </main>

    <script type="module" src="/src/index.js"></script>

  </body>
</html>
